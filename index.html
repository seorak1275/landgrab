<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2430">
<title>땅따먹기</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <span id="top-gold">💰 0</span>
  <span id="top-rate">+0/초</span>
  <span id="top-prestige">환생 0</span>
  <span id="top-points">✨ 0</span>
  <button id="btn-speed" type="button" title="배속">▶×1</button>
  <button id="btn-menu" type="button">≡</button>
</header>
<div id="map">
  <canvas id="canvas"></canvas>
  <button id="btn-center" type="button" title="지도 전체 보기">⌖</button>
</div>
<section id="panel">
  <div id="p-title">타일을 탭하세요</div>
  <div id="p-stats"></div>
  <div id="p-actions">
    <button id="btn-upgrade" type="button" disabled>업그레이드</button>
    <div id="ratio">
      <button class="ratio-btn" data-r="0.25" type="button">25%</button>
      <button class="ratio-btn active" data-r="0.5" type="button">50%</button>
      <button class="ratio-btn" data-r="1" type="button">100%</button>
    </div>
  </div>
  <div id="p-build" hidden>
    <button id="bd-farm" data-build="farm" type="button" title="골드 +60%">🌾농장</button>
    <button id="bd-barracks" data-build="barracks" type="button" title="병사 +60%, 출발 공격 +15%">⚔️병영</button>
    <button id="bd-wall" data-build="wall" type="button" title="방어 +50%, 한도 +25%">🛡️성벽</button>
    <button id="bd-tower" data-build="tower" type="button" title="8초마다 이길 수 있는 옆 땅 자동 공격">🏹망루</button>
    <button id="bd-none" data-build="" type="button" title="철거(무료)">✕</button>
    <button id="bd-help" type="button" title="건물 설명">?</button>
  </div>
  <div id="p-select">
    <button id="btn-multi" type="button">✎ 드래그 선택</button>
    <button id="btn-all" type="button">내 땅 전체 선택</button>
  </div>
  <div id="hint"></div>
</section>
<div id="modal" hidden>
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
