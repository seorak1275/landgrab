<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2430">
<title>땅따먹기 · 전역</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  #wrap { padding: 14px 14px calc(20px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 6px 0 2px; }
  .sub { color: #8fa0b0; font-size: 13px; margin: 0 0 14px; }
  .stage { display: flex; gap: 10px; align-items: center; background: #1a2430; border: 1px solid #2c3a48; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .stage.locked { opacity: 0.45; }
  .stage.next { border-color: #2f80ed; box-shadow: 0 0 0 1px #2f80ed inset; }
  .stage .ic { font-size: 26px; width: 34px; text-align: center; }
  .stage .body { flex: 1; min-width: 0; }
  .stage .t { font-weight: 700; font-size: 16px; }
  .stage .d { color: #93a4b4; font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .stage .meta { color: #6f8090; font-size: 11px; margin-top: 3px; }
  .stage .stars { color: #ffd479; font-size: 14px; letter-spacing: 1px; }
  .stage button { padding: 9px 14px; border-radius: 9px; border: 1px solid #3a4a5a; background: #22303e; color: #eee; font-size: 14px; font-weight: 600; }
  .stage button.go { background: #2f80ed; border-color: #2f80ed; }
  .stage button:disabled { color: #6a7886; background: #1a2430; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: #a9b8c6; }
  .bar a { color: #6fb1ff; text-decoration: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar"><span id="stars">★ 0</span> <span><a href="index.html">⬡ 육각 자유</a> · <a href="region.html">🗺 사단전 자유</a></span></div>
  <h1>전역 — 단계마다 지도가 바뀝니다</h1>
  <p class="sub">앞 단계를 <b>정복</b>하면 다음 지도가 열립니다. 빠를수록 별을 더 받습니다(★★★). 유산·계급·장군은 자유 모드와 그대로 이어집니다.</p>
  <div id="list"></div>
  <p class="sub" id="tail"></p>
</div>
<script type="module">
  import { STAGES, loadCampaign, isUnlocked, nextStage, totalStars, stageUrl } from './src/campaign.js';
  const c = loadCampaign();
  const nx = nextStage(c);
  const hms = s => (s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분` : `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초`);
  document.getElementById('stars').textContent = `★ ${totalStars(c)} / ${STAGES.length * 3}`;
  document.getElementById('list').innerHTML = STAGES.map(s => {
    const done = (c.cleared || {})[s.id];
    const open = isUnlocked(c, s.id);
    const isNext = nx && nx.id === s.id;
    const stars = done ? '★'.repeat(done.stars) + '☆'.repeat(3 - done.stars) : '';
    return `<div class="stage ${open ? '' : 'locked'} ${isNext ? 'next' : ''}">
      <div class="ic">${s.icon}</div>
      <div class="body">
        <div class="t">${s.n} <span class="stars">${stars}</span></div>
        <div class="d">${s.desc}</div>
        <div class="meta">${s.mode === 'hex' ? '⬡ 육각 모드' : '🗺 사단전'} · 별 기준 ${hms(s.par[0])} / ${hms(s.par[1])}${done ? ` · 최고 ${hms(done.time)}` : ''}</div>
      </div>
      ${open ? `<button class="${isNext ? 'go' : ''}" data-go="${s.id}">${done ? '다시' : '시작'}</button>` : '<button disabled>🔒</button>'}
    </div>`;
  }).join('');
  document.getElementById('tail').textContent = nx ? `다음: ${nx.icon} ${nx.n}` : '모든 단계를 깼습니다. 자유 모드에서 계속 겨루거나, 더 빠른 별에 도전하세요.';
  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    const s = STAGES.find(x => x.id === b.dataset.go);
    location.href = stageUrl(s);
  });
</script>
</body>
</html>
